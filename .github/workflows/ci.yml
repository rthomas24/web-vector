name: CI
permissions:
  contents: read
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
  schedule: [{ cron: '0 6 * * *' }]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { node: [22, 24] }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      # Offline retrieval eval over recorded fixtures; fails on ranking regressions vs eval/baseline.json.
      - run: npm run eval
  live:
    # Real network + local model; runs nightly and on manual dispatch.
    # Depends on third-party services (DuckDuckGo, Wikipedia, arXiv, model CDN), so a failure here
    # is reported on the job but does not fail the workflow — the offline `test` job is the gate.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: npm }
      - run: npm ci && npm run build
      - run: npm run test:live
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
